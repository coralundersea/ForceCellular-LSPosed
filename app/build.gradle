plugins {
    id 'com.android.application'
}

android {
    namespace 'com.force.cellular'
    compileSdk 34

    defaultConfig {
        applicationId "com.force.cellular"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false }
}

dependencies {
    // Stubs are in source, no external jar needed
}
