plugins {
    id 'com.android.application'
}

android {
    namespace 'com.force.cellular'
    compileSdk 34

    defaultConfig {
        applicationId "com.force.cellular"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Avoid some lint issues
    lint {
        abortOnError false
    }
}

dependencies {
    // Try compileOnly first
    compileOnly 'de.robv.android.xposed:api:82'
    // Fallback comment: if fails, user can put api-82.jar into app/libs/
}
