plugins {
    id 'com.android.application'
}

android {
    namespace 'com.force.cellular'
    compileSdk 34

    defaultConfig {
        applicationId "com.force.cellular"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
}
