name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          cat local.properties

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2 || true
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --info || true
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found yet"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForceCellular-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: warn
